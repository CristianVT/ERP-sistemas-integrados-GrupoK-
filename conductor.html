<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TransAndes ERP · Mis servicios · Conductor</title>
  <meta name="description" content="Prototipo de alta fidelidad del Módulo K - Gestión de Transporte y Rutas. Datos simulados." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-rol="Conductor">
  <div class="layout">
    <!-- Barra lateral: navegación por rol -->
    <aside class="sidebar" id="sidebar" aria-label="Menú principal">
      <div class="brand">
        <div class="brand-logo">T</div>
        <div>
          <strong>TransAndes ERP</strong>
          <small>Transporte y Rutas · Grupo K</small>
        </div>
      </div>
      <nav id="nav"></nav>
    </aside>
    <div class="overlay" id="overlay"></div>

    <div class="main">
      <!-- Cabecera: sucursal, rol y usuario -->
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Abrir menú">☰</button>
        <span class="branch" id="branch">Trujillo</span>
        <span class="spacer"></span>
        <span class="role-pill" id="rolePill">Conductor</span>
        <span class="user-name" id="userName">Jorge Salazar Díaz</span>
        <span class="avatar" id="avatar">JS</span>
      </header>

      <main class="content" id="app" tabindex="-1"></main>
    </div>
  </div>

  <!-- Modal reutilizable de confirmación -->
  <div class="modal-bg" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <h3 id="modalTitle"></h3>
      <p id="modalText"></p>
      <div id="modalBody"></div>
      <div class="btn-row">
        <button class="btn ghost" id="modalCancel">Volver</button>
        <button class="btn primary" id="modalOk">Confirmar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
